{% extends "base.html" %}
{% block title %}Borderless — Julia Wojacka{% endblock %}

{% endblock %}

{% block content %}
<div style="margin-bottom: 2rem;">
  <h1>Borderless —<br><em>sketch to image</em></h1>
  <p style="font-size: 13px; color: #6B6850; line-height: 1.8; max-width: 500px;">Draw a sketch below and hit send to pass it through the image generation pipeline.</p>
</div>

<hr>

<div class="borderless-wrap">

  <div class="toolbar">
    <div class="color-options">
      <div class="color-swatch active" style="background:#2C2A22;" onclick="setColor('#2C2A22', this)"></div>
      <div class="color-swatch" style="background:#6B7A3A;" onclick="setColor('#6B7A3A', this)"></div>
      <div class="color-swatch" style="background:#C0392B;" onclick="setColor('#C0392B', this)"></div>
      <div class="color-swatch" style="background:#2980B9;" onclick="setColor('#2980B9', this)"></div>
      <div class="color-swatch" style="background:#E67E22;" onclick="setColor('#E67E22', this)"></div>
      <div class="color-swatch" style="background:#8E44AD;" onclick="setColor('#8E44AD', this)"></div>
      <div class="color-swatch" style="background:#F5F0E8; border: 0.5px solid #D4CBAF;" onclick="setColor('#F5F0E8', this)"></div>
    </div>

    <div class="color-picker-wrap">
      <span>custom</span>
      <input type="color" id="customColor" value="#2C2A22" oninput="setCustomColor(this.value)">
    </div>

    <div class="divider-v"></div>

    <div class="size-wrap">
      <span>size</span>
      <input type="range" id="brushSize" min="1" max="40" value="4" oninput="updateSize(this.value)">
      <span id="sizeLabel">4px</span>
    </div>

    <div class="divider-v"></div>

    <div class="btn-row">
      <button class="btn" onclick="toggleEraser()"><span class="eraser-icon">◻</span> <span id="eraserLabel">eraser</span></button>
      <button class="btn" onclick="clearCanvas()">clear</button>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="sketchCanvas" width="800" height="500"></canvas>
  </div>

  <div class="btn-row">
    <button class="btn primary" onclick="saveCanvas()">save as PNG ↓</button>
  </div>

</div>

<script>
  const canvas = document.getElementById('sketchCanvas');
  const ctx = canvas.getContext('2d');

  // fill white background
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  let drawing = false;
  let currentColor = '#2C2A22';
  let brushSize = 4;
  let erasing = false;
  let lastX = 0;
  let lastY = 0;

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    if (e.touches) {
      return {
        x: (e.touches[0].clientX - rect.left) * scaleX,
        y: (e.touches[0].clientY - rect.top) * scaleY
      };
    }
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top) * scaleY
    };
  }

  function startDraw(e) {
    e.preventDefault();
    drawing = true;
    const pos = getPos(e);
    lastX = pos.x;
    lastY = pos.y;
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, (erasing ? brushSize * 3 : brushSize) / 2, 0, Math.PI * 2);
    ctx.fillStyle = erasing ? '#FFFFFF' : currentColor;
    ctx.fill();
  }

  function draw(e) {
    e.preventDefault();
    if (!drawing) return;
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(pos.x, pos.y);
    ctx.strokeStyle = erasing ? '#FFFFFF' : currentColor;
    ctx.lineWidth = erasing ? brushSize * 3 : brushSize;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
    lastX = pos.x;
    lastY = pos.y;
  }

  function stopDraw() { drawing = false; }

  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDraw);
  canvas.addEventListener('mouseleave', stopDraw);
  canvas.addEventListener('touchstart', startDraw, { passive: false });
  canvas.addEventListener('touchmove', draw, { passive: false });
  canvas.addEventListener('touchend', stopDraw);

  function setColor(color, el) {
    currentColor = color;
    erasing = false;
    document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('eraserLabel').textContent = 'eraser';
  }

  function setCustomColor(color) {
    currentColor = color;
    erasing = false;
    document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
    document.getElementById('eraserLabel').textContent = 'eraser';
  }

  function updateSize(val) {
    brushSize = val;
    document.getElementById('sizeLabel').textContent = val + 'px';
  }

  function toggleEraser() {
    erasing = !erasing;
    document.getElementById('eraserLabel').textContent = erasing ? 'drawing' : 'eraser';
    document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
  }

  function clearCanvas() {
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  function saveCanvas() {
    const link = document.createElement('a');
    link.download = 'borderless-sketch.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

  // make canvas responsive
  function resizeCanvas() {
    const maxWidth = Math.min(800, window.innerWidth - 64);
    canvas.style.width = maxWidth + 'px';
    canvas.style.height = (maxWidth * 500 / 800) + 'px';
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
</script>
{% endblock %}
